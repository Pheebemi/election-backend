{% load portal %}
<div class="overflow-hidden rounded-2xl border border-slate-200 bg-white dark:border-white/10 dark:bg-white/5">
  <div class="flex items-center justify-between border-b border-slate-100 px-4 py-3 text-xs font-semibold text-brand-700 dark:border-white/10 dark:text-brand-200">
    <span class="flex items-center gap-2">{% include "web/includes/icon.html" with name="map-pin" cls="size-4" %} Taraba State · leading party by LGA</span>
    <span>{{ map.count }} LGAs</span>
  </div>
  <div class="relative p-3">
    <svg viewBox="{{ map.viewbox }}" class="mx-auto h-auto w-full {{ svg_cls }}" role="img" aria-label="Map of Taraba State LGAs by leading party" data-map>
      {% for s in map.shapes %}
      <path d="{{ s.d }}" fill="{{ s.fill }}" stroke="#0f172a" stroke-width="1.25" class="cursor-pointer transition-[fill,opacity] duration-150" data-map-shape data-tip="{{ s.tooltip }}"></path>
      {% endfor %}
      {% for s in map.shapes %}{% if s.label %}
      <text x="{{ s.cx }}" y="{{ s.cy }}" text-anchor="middle" dominant-baseline="middle" font-size="{{ label_size|default:20 }}" font-weight="700" fill="#ffffff" pointer-events="none" style="paint-order: stroke; stroke: rgba(0,0,0,0.45); stroke-width: 0.7">{{ s.label }}</text>
      {% endif %}{% endfor %}
    </svg>
  </div>
  <div class="flex flex-wrap items-center gap-x-4 gap-y-2 border-t border-slate-100 px-4 py-3 dark:border-white/10">
    {% for w in map.winners %}
    <span class="flex items-center gap-1.5 text-xs text-slate-600 dark:text-slate-300"><span class="inline-block size-2.5 rounded-full" style="background-color: {{ w.color }}"></span>{{ w.abbr }}</span>
    {% endfor %}
    <span class="flex items-center gap-1.5 text-xs text-slate-400"><span class="inline-block size-2.5 rounded-full" style="background-color: rgba(148,163,184,0.30)"></span>No data</span>
  </div>
</div>
