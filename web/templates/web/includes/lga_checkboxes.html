<div class="grid grid-cols-2 gap-2 sm:grid-cols-3 md:grid-cols-4">
  {% for l in lgas %}
  <label class="flex cursor-pointer items-center gap-2 rounded-lg border border-slate-200 px-3 py-2 text-sm transition hover:border-slate-300 has-[:checked]:border-brand-400 has-[:checked]:bg-brand-50 has-[:checked]:text-brand-800 dark:border-white/10 dark:hover:border-white/20 dark:has-[:checked]:border-brand-400/50 dark:has-[:checked]:bg-brand-500/10 dark:has-[:checked]:text-brand-100">
    <input type="checkbox" name="lga_ids" value="{{ l.id }}" class="size-4 accent-brand-600" {% if l.id in selected %}checked{% endif %}>
    <span class="truncate">{{ l.name }}</span>
  </label>
  {% endfor %}
</div>
