<div class="flex items-center gap-2">
  <a href="{% url 'web:present' %}" title="Full-screen view for the situation-room projector" class="btn btn-outline border-brand-200 text-brand-800 hover:bg-brand-50 dark:border-white/15 dark:bg-transparent dark:text-brand-100 dark:hover:bg-white/10">
    {% include "web/includes/icon.html" with name="monitor-play" %}<span class="hidden sm:inline">Projector mode</span>
  </a>
  {% if user.is_authenticated %}
  <a href="{% url 'web:entry' %}" class="btn bg-brand-700 text-white hover:bg-brand-800">Dashboard {% include "web/includes/icon.html" with name="arrow-right" %}</a>
  {% else %}
  <a href="{% url 'web:login' %}" class="btn bg-brand-700 text-white hover:bg-brand-800">Clerk login {% include "web/includes/icon.html" with name="arrow-right" %}</a>
  {% endif %}
</div>
