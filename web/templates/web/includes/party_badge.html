{% if party.logo %}<span class="{{ cls|default:'size-10' }} flex flex-none items-center justify-center overflow-hidden rounded-full bg-white ring-2 ring-white/40"><img src="{{ party.logo }}" alt="{{ party.name }} logo" class="h-full w-full object-contain"></span>{% else %}<span class="{{ cls|default:'size-10' }} flex flex-none items-center justify-center rounded-full text-[10px] font-bold text-white" style="background-color: {{ party.color }}">{{ party.abbr }}</span>{% endif %}
